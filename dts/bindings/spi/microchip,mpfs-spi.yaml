description: Microchip Polarfire SOC SPI controller

compatible: 
 - "microchip,mpfs-spi" 
 - "microchip,corespi-rtl-v5"

include: [spi-controller.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  cs-gpios:
    required: true